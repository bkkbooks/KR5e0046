body:
  text: 自然集馬先生著道詞點絳唇道妙玄微先須要悟明心地非容易見放着古聖文書內隱着眞消息混江龍若說着胎元根蒂只除是含光默默守虛極去動中求靜靜定是幽微默坐忘言方是道羣居緘口是道根基有一等明師自高自大狂言詐語道聽塗說自把他元神昧全不怕上天照察也不怕六道輪迴油葫蘆道本無言行妙理奪天地髓就中只許自家知無中生有人還會玉爐內常把陰陽來配要進火功莫得遲雙關透入泥丸內自然顯光輝天下樂金液還丹下玉梯烹煎白雪飛黃芽漸長生天地質體內眞路不迷化瓊漿滿玉池後庭花饑中飽飽後饑飲醍醐滋腎水將地戸牢關閉化眞精吞玉蘂吐虹蜺黃庭內相會見金公紅了面皮將嬰兒和戊己共元神相護持柳葉兒直赶到天宮裏相會有姹女雨淚悲垂丁郎見了長吁氣配佳期霎時間聚散分離金盞兒山頭雪巽風吹甘露降飲刀圭調停火候功夫細久全陰靜養神龜丹成金滿屋烏兔任東西若是將坎離顛倒鍊魂魄養胎基賞花時暫選一片白雪滿地堆運二氣相交飲玉杯三田內温習四相和合體五明宮守眞實么鍊六尺身軀修自己變七朵金蓮到處隨配八卦跨鸞歸至九霄雲外十分的顯雄威煞尾十載苦修行九陌爲活計八百行修成玉體七星劍從來除下鬼六合內參透希夷唱道習五祖無爲四闤內功夫誰得知養三田聚美有二天神相濟現一輪明月照玄機一枝花自從俺學出家偶然把明師遇受辛勤十數載無明夜辦功夫傳的是道妙虛無教我緊把丹田固為殘生作道術行火候煅鍊增加入靜定方為沐浴梁州寂然不動分毫志鍊金丹除了厄苦離塵俗換了凡軀忘言减語片時間收歛鉛汞聚有根蒂伏樸歸眞有志氣騰雲躡霧有縁分飛上天衢初學篤志眞言語見世俗人貪財好慾不顧殘生一箇箇要儹金珠大限到百事都無費精神使得乾枯從今至古神仙本是凡人做定浮沉認賓主收汞收鉛莫遲阻自問他有有無無告皇天化清香吹入中霄路一時間造化須臾舞翩翩海底尋鷗鷺喜的是冷淡蕭疏弟子師徒笑吟吟同步赴仙都蓬萊三島歸家去晝夜功夫無思慮冥冥杳杳恍恍惚惚天門開放道清虛地戸牢關抽添無數澄澄湛湛功程做獨坐忘言默語駕河車上下寬舒功成純粹守似有卻如無明明地不昧元來路包含萬象體不掛絲銖烏夜啼運坤火乾天霧要慇懃守玉爐鍊眞汞成至寶烹白雪似金珠煅黃芽做地母飲刀圭習眞土將龍虎來擒伏呼風喚雨煞尾化金仙脫體乘風去一道寒光滿太虛有嬰兒有姹女有黃婆配親女霎時間會雲雨眾仙歡箇箇舞出了世塵離愛欲早則不回頭一心覓鍾呂直至蓬萊伴師祖同共羣仙一處宿昇降三宫到紫府調息綿綿鍊眞土收歛黃芽治龍虎騎坐白鶴跨鸞輅離卻凡間登仙路再共清風做伴侶又共明月做道主飛入天宮翫仙府新水令我在這門中整窮究了數十年纔參透了聖人機變定浮沉歸妙理進坤火鍊丹田先鎖住意馬心猿更不把世俗纏駐馬聽行的是調息綿綿呼吸風雲有後先比及得三宫昇變九還七返妙中玄駕河車搬運走如烟化清風直至金公院若要道心堅黃河浪滚泥丸轉步步嬌大道從來人難羨有影無形現壺中別有天鍊就金丹養胎仙雙關路上炁連連醖甘露頻吞咽沉醉東風大限到來不選也不論福富貴高官直推到幾時休幾時休每日價頻發願頻發願今年推到來年擔閣修行行路兒遠生死輪迴怎免雁兒落過得勝令俺也曾遇明師將眞道傳指與無爲傳教我少貪心少愛慾教俺多辦工夫多修善教俺休把利名牽教俺多看些古書篇盡都是通玄處教俺共眞師子細研若是俺功全得造化無人見正是心也堅心堅得自然沽美酒將鉛汞鼎內煎鍊至寶用乾乾妙在前弦與後弦分明有路顯引元神赴宫殿妙用三關機變一炁來透徹三田九轉爐中烟熖龍虎龜蛇蟠旋出於自然自然有一箇無爲眞人出現川撥棹好教我笑喧喧共諸仙一處眠也不索訪道參禪常要默坐忘言調眞息若不炁喘有先天有後天殿前歡勸英賢請君常看指玄篇無爲大道人都戀要行滿功圓跨鶴兒飛上天方纔入無爲傳早則趁了修行願修一箇不來不去誰肯戀在世長年歇指調這回再誰把世俗纏超凡入聖隨機變道法雙忘緊固抽添唱道眞至蓬萊閬苑做下部自然集早則是虛無篇願心滿滚繡毬辦功夫定慧開鍊三皇結聖胎嬰兒猛然驚怪須臾間飛過靈臺到黃庭內院歡動陽關將龍虎排霎時間打成一塊定浮沉煅鍊三灾三華聚頂泥丸路五炁朝元遶玉街下十二樓臺倘秀才調和就鉛汞冶驀見坎女離男打乖自有金公一處埋成造化笑詒詒快哉端正好誰知道我靜中行功勞大這回早不染塵埃幼年間曾把明師拜教俺跳出迷魂寨迎仙客長將他玉爐關須要這八門開用坎離顛倒栽駕河車牛旋買搬載入宮來收歛在三田外紅繡鞋坐臥處陽昇陰降一竅開百竅齊開九還七返定三灾呼吸開歸妙道調眞息透盈腮治精華歸炁海鮑老兒鍊元神觀自在養胎仙笑顔開三田炁滚透胸懷煅至寶功勞大萬語千言句句該都出在道德陰符界發動天關潤九垓採藥物在乾坤外白雲堆裏飛昇快變化累劫修來耍孩兒初學篤志眞心愛廣看些經書註解忽然間心地悟豁然開自想往日沉埋果然實有登仙路任意縱橫到處該還了這冤家債這回萬縁齊斷不染千灾一煞靜中功默默的行點刀圭分皂白靈臺無物當甯耐脫離生死修眞路倒把枯松日夜栽權且將時光來待咫尺的是功圓行滿獨步上天台二煞也不索看三教書也不索學七步才只要昏昏默默將功程捱鍊成玉體乘風去一道寒光入聖階做一箇蓬萊客全憑三千功行滿便要離俗骨得仙胎三煞任時節跨青鸞飛上天駕白鶴復地來飛昇變化登仙界黃芽漸長人難識玉兔窩中好避乖權且將時光待咫尺的功圓行滿獨步上天台煞尾有靜功有定功無罣礙無罣礙這回還了人倫債跳出迷魂是非海正宫撇了是和非掉了爭和鬥把俺這心猿意馬牢收我則待舞西風雨葉寬袍袖看日月搬昏晝千家飯足可求百衲衣不害羞問什麽破設設遮着皮肉傲人間伯子公侯我則待閒遙遙唱箇道情醉醺醺的打箇稽首抄化聖湯仙酒䔧杖瓢鉢便是俺的行頭我則待今朝有酒今朝醉明日無錢明日求到大來散袒無憂倘秀才有一等積書與子孫未必盡收有一等積金與子孫未必盡守我勸你莫與兒孫作馬牛今日箇雲生山勢巧來日箇霜降水痕收怎熬得他烏飛兔走滚繡毬恰纔見元宵燈挑在手又見清明門前插楊柳正修褉傳觴曲水不覺的擊鼉鼓競渡龍舟恰纔是七月七又早是九月九咱能勾幾番兒歡喜厮守都在煩惱中過了春秋你見這紛紛的世事恁待要隨縁過都不顧急急光陰似水流白了人頭倘秀才有一等人造花園磨磚砌甃有一等人蓋亭館雕梁畫斗費盡功夫得成就今日做了張家地明朝做了李家樓剛一似翻手覆手衮繡毬剗荆棘做沼池去蓬蒿廣栽花柳四時間如開綿繡主人家能幾遍而來往追遊俺這裏亭臺卽漸衰花木取次休荆棘又還依舊使行人嘆源流往常時奇花異卉千般秀今日都做了野草閑花滿地愁這不是葉落歸秋呆骨朵休言道堯舜和桀紂則不如郝王孫譚馬邱劉他每是文中子門徒亢倉子志友休言爲吏的張平叔偃月的劉行首則不如闡全眞王祖師道不如打回頭馬半州醉太平漢鍾離本是箇帥首藍采和是箇徘優懸壺子本不曾去沽酒鐵拐李火焚了尸首賀蘭仙引定箇曹國舅韓湘子會造逡巡酒呂洞賓三醉岳陽樓度了一株緑柳尾休言功行何時就得到玄關便可投人我場中枉馳驟苦海波中早回首四大神遊三島十洲神仙隱跡埋名他則待目前走又正宫我做的利己脫身術恁做的害眾成家活恁道我風魔你更風魔俺這裏無名無利都參破你利害有他這天來大俺這裏笑一合利名場朗然識破沒來由爲兒女劫劫波波便儹下不義財積下些無用貨死臨頭怎生逃躲少不的打輪迴作馬騾明放着天堂有路人行少地獄無門去的多落落魄魄
